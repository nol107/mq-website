  <script>
    /* ── Release party page: ticket link + tracking + interest form ──
       CONFIG — the only values to edit:
       - EVENT_URL     : Shotgun event page.
       - SITE_SOURCE   : utm_source always sent to Shotgun (matches the
                         Shotgun tracking link "site-mq", so every sale coming
                         through this page shows up in the dashboard).
                         Where the visitor came from (?utm_source=meta,
                         ?from=insta…) is passed as utm_medium, visible in the
                         order export.
       - BREVO_ACTION  : the "action" URL of the Brevo form
                         (https://xxxx.sibforms.com/serve/...). Leave empty to
                         hide the interest block.
    */
    (function () {
      "use strict";
      var EVENT_URL = "https://shotgun.live/events/quasar-session-vol-2-release-party";
      var SITE_SOURCE = "site-mq";
      var BREVO_ACTION = "https://1e948468.sibforms.com/serve/MUIFACSeADJQFYmT5Xze7s-VPs9ssqe7tW2t3rxSsuJJNkx5LgXLF317fmyHLs8c1WOGd69aegeyBjP2Ipqg-5BAmUI5OQKw8FdpxdTDSHkTBuzdWxeEd2VqWCtzRZhPCCRDjRCxgncU4gHd_2Mi8sr4GoN8hFrV5UFQ7EOY6oYjc9SmUPc4v3PVP8WkGDYGFM-f0FS-Z4JKrOJRVA==";

      function clean(v) { return (v || "").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 60); }

      // utm_source is always the site's tracking link; the visitor's origin
      // (/release-party.html?utm_source=meta or ?from=insta) becomes utm_medium.
      var params = new URLSearchParams(window.location.search);
      var source = clean(params.get("utm_source") || params.get("from")) || "direct";
      var ticketUrl = EVENT_URL + "?utm_source=" + encodeURIComponent(SITE_SOURCE) +
        "&utm_medium=" + encodeURIComponent(source);
      // Keep the ad context on the Shotgun side: utm_campaign shows in the
      // order export, and fbclid lets Shotgun's own pixel set its _fbc
      // click-ID cookie, so a purchase can be tied back to the Meta ad click.
      var campaign = clean(params.get("utm_campaign"));
      if (campaign) ticketUrl += "&utm_campaign=" + encodeURIComponent(campaign);
      var fbclid = (params.get("fbclid") || "").replace(/[^A-Za-z0-9_.-]/g, "").slice(0, 500);
      if (fbclid) ticketUrl += "&fbclid=" + encodeURIComponent(fbclid);

      var buyLinks = document.querySelectorAll("[data-rp-buy]");
      buyLinks.forEach(function (a) {
        a.href = ticketUrl;
        a.addEventListener("click", function (e) {
          if (typeof window.mqTrack !== "function" || !window.mqHasConsent || !window.mqHasConsent()) return;
          // Give the pixel / GA hit a moment to leave before navigating.
          e.preventDefault();
          window.mqTrack("rp_click_billetterie", { source: source, placement: a.closest(".mq-nav") ? "nav" : "page" },
            { meta: "RP_ClickBilletterie" });
          // Shared "intent" event (ticket click OR email sign-up) → one
          // custom conversion to optimise the ads on.
          window.mqTrack("rp_intent", { source: source, action: "billetterie" }, { meta: "RP_Intent" });
          setTimeout(function () { window.location.href = ticketUrl; }, 300);
        });
      });

      // Page view as a custom Meta event (never ViewContent: see js/consent.js).
      function trackView() { window.mqTrack && window.mqTrack("rp_pageview", { source: source }, { meta: "RP_PageView" }); }
      if (window.mqHasConsent && window.mqHasConsent()) { trackView(); }
      else { document.addEventListener("mq:consent-granted", trackView, { once: true }); }

      // Interest form → Brevo.
      var block = document.querySelector("[data-rp-interest]");
      var form = document.querySelector("[data-rp-form]");
      var msg = document.querySelector("[data-rp-msg]");
      if (!BREVO_ACTION || !block || !form) return;
      block.hidden = false;
      var toggle = document.querySelector("[data-rp-toggle]");
      if (toggle) toggle.addEventListener("click", function () {
        document.body.classList.add("rp-show-form");
        form.elements.EMAIL.focus();
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        msg.className = "rp-form__msg";
        var email = form.elements.EMAIL.value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          msg.textContent = "Adresse email invalide.";
          msg.classList.add("is-err");
          return;
        }
        if (!form.elements.OPT_IN.checked) {
          msg.textContent = "Coche la case pour qu'on puisse t'écrire.";
          msg.classList.add("is-err");
          return;
        }
        var data = new FormData(form);
        data.append("locale", "fr");
        data.append("html_type", "simple");
        var btn = form.querySelector("button[type=submit]");
        btn.disabled = true;
        // Brevo does not send CORS headers: the response is opaque, so a
        // resolved fetch means "sent", not "confirmed".
        fetch(BREVO_ACTION, { method: "POST", mode: "no-cors", body: data })
          .then(function () {
            msg.textContent = "C'est noté ! On te tient au courant de l'avancée de la billetterie.";
            msg.classList.add("is-ok");
            form.reset();
            window.mqTrack && window.mqTrack("rp_lead", { source: source }, { meta: "Lead" });
            window.mqTrack && window.mqTrack("rp_intent", { source: source, action: "email" }, { meta: "RP_Intent" });
          })
          .catch(function () {
            msg.textContent = "Oups, l'envoi a échoué. Réessaie dans un instant.";
            msg.classList.add("is-err");
          })
          .finally(function () { btn.disabled = false; });
      });
    })();
  </script>
