<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Release Party Quasar Sessions Vol.2 – Maison Quasar</title>
  <meta name="description" content="Billetterie de la release party Quasar Sessions Vol.2 — samedi 21 novembre 2026 au ciNey, Paris 18e." />
  <meta name="robots" content="noindex, follow" />

  <!-- Simple redirect to the Shotgun event page (the landing page is no longer
       needed since Meta ads no longer point here). The Shotgun tracking link
       puts where the visitor came from (?from= or ?utm_source= on this URL,
       "site-mq" otherwise) in utm_source, so sales keep their origin in the
       Shotgun orders export. No tracker is loaded here. -->
  <script>
    (function () {
      var EVENT_URL = "https://shotgun.live/events/quasar-session-vol-2-release-party";
      var params = new URLSearchParams(window.location.search);
      function clean(v) {
        return (v || "").trim().toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 40);
      }
      // The Shotgun export shows our utm_source as-is, but its "UTM MEDIUM"
      // column only ever holds app/website, so the visitor's origin goes in
      // utm_source (like /billetterie). No origin -> "site-mq".
      var origin = clean(params.get("from") || params.get("utm_source")) || "site-mq";
      var target = EVENT_URL + "?utm_source=" + encodeURIComponent(origin) + "&utm_medium=site-mq";
      var campaign = clean(params.get("utm_campaign"));
      if (campaign) target += "&utm_campaign=" + encodeURIComponent(campaign);
      var fbclid = (params.get("fbclid") || "").replace(/[^A-Za-z0-9_.-]/g, "").slice(0, 500);
      if (fbclid) target += "&fbclid=" + encodeURIComponent(fbclid);
      window.location.replace(target);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://shotgun.live/events/quasar-session-vol-2-release-party?utm_source=site-mq&amp;utm_medium=noscript" />
  </noscript>

  <link rel="icon" type="image/png" href="Logos/MAISON%20QUASAR%20Q%20LOGO%2001.png" />
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    a { color: #fff; }
  </style>
</head>
<body>
  <p>Redirection vers la billetterie…<br />
    <small>Si rien ne se passe, <a href="https://shotgun.live/events/quasar-session-vol-2-release-party?utm_source=site-mq&amp;utm_medium=fallback">cliquez ici</a>.</small>
  </p>
</body>
</html>
